name: Atualizar fundamentos CVM

on:
  schedule:
    - cron: "17 9 5 * *"   # todo dia 5 de cada mês, por volta de 06h17 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar fundamentos a partir da CVM
        run: python gerar_fundamentos.py

      - name: Salvar no repositório (somente se houver mudança)
        run: |
          git config user.name "atualizador-cvm"
          git config user.email "actions@users.noreply.github.com"
          git add fundamentos_cvm.json
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados da CVM."
          else
            git commit -m "Atualização CVM $(date -u +%Y-%m-%d)"
            git push
          fi
